
#!/bin/bash

# ==========================================
# Configuration Apache JMeter
# Projet : CI-Lab
# ==========================================

# Version de JMeter
JMETER_VERSION="5.6.3"

# Compte applicatif
JMETER_USER="jmeterapp"
JMETER_GROUP="jmeterapp"
JMETER_USER_HOME="/home/jmeterapp"

# Installation JMeter
JMETER_HOME="/opt/jmeter"
JMETER_BIN="${JMETER_HOME}/bin/jmeter"

# Archive d'installation
JMETER_ARCHIVE="/opt/apache-jmeter-${JMETER_VERSION}.tgz"

# Répertoires de travail
JMETER_TESTS="${JMETER_HOME}/tests"
JMETER_RESULTS="${JMETER_HOME}/results"
JMETER_REPORTS="${JMETER_HOME}/reports"

# Scénario de test
JMETER_SCENARIO="${JMETER_TESTS}/ci-app-load-test.jmx"

# Fichiers de résultats
JMETER_RESULT_FILE="${JMETER_RESULTS}/ci-app-results.jtl"
JMETER_LOG_FILE="${JMETER_RESULTS}/ci-app-jmeter.log"

# Rapport HTML
JMETER_HTML_REPORT="${JMETER_REPORTS}/ci-app"
