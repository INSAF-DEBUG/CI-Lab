
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ci-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/INSAF-DEBUG/CI-Lab.git
    targetRevision: main
    path: helm/ci-app
    helm:
      releaseName: ci-app

  destination:
    server: https://kubernetes.default.svc
    namespace: default

